<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>bigbid AI — Turn Product Photos Into Auction-Ready Listings</title>
  <meta name="description" content="bigbid AI is AI-powered inventory and auction listing software for resellers, auction houses, wholesalers, warehouses, liquidation businesses, and pallet sellers." />
  <meta name="keywords" content="AI auction listing software, reseller inventory software, auction lot creation software, wholesale inventory automation, warehouse listing software, liquidation inventory software, HiBid export tool, MSRP estimation tool" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#0d201b;--green:#0c7656;--green2:#095f47;--cream:#f6f1e6;--paper:#fffdf8;--line:#d9cfbd;--muted:#6f766f;--soft:#e8f1ec;--gold:#c3a36f;
      --shadow:0 18px 50px rgba(23,37,31,.10);--radius:24px;
    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,sans-serif;line-height:1.55}
    a{text-decoration:none;color:inherit}.wrap{width:min(1180px,calc(100% - 40px));margin:auto}.section{padding:96px 0}.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:var(--green)}
    h1,h2,h3{margin:0;line-height:1.05}h1,h2{font-family:"Playfair Display",serif}h1{font-size:clamp(48px,7vw,84px);letter-spacing:-.035em}h2{font-size:clamp(38px,5vw,62px);letter-spacing:-.025em}h3{font-size:22px}.lead{font-size:clamp(18px,2vw,22px);color:#39483f;max-width:760px}.muted{color:var(--muted)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;padding:14px 22px;font-weight:700;border:1px solid var(--line);background:var(--paper);transition:.2s}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(13,32,27,.08)}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.primary:hover{background:var(--green2)}.btn.small{padding:11px 18px;font-size:14px}.btn.ghost{background:transparent}
    .nav{position:sticky;top:0;z-index:50;background:rgba(246,241,230,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(217,207,189,.7)}.navin{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:"Playfair Display",serif;font-weight:800;font-size:30px;letter-spacing:-.04em}.brand span{color:var(--green)}.links{display:flex;gap:28px;align-items:center;font-size:14px;font-weight:600}.links a:not(.btn){color:#36483f}.menu{display:none}
    .hero{padding:70px 0 78px}.hero-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:44px;align-items:center}.hero-copy p{margin:24px 0}.cta-row{display:flex;gap:12px;flex-wrap:wrap}.micro{font-size:13px;color:var(--muted);margin-top:12px}.audience{margin-top:28px;display:flex;flex-wrap:wrap;gap:9px}.chip{border:1px solid var(--line);background:rgba(255,253,248,.55);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600}
    .hero-visual{position:relative;min-height:620px}.phone{position:absolute;left:0;top:24px;width:49%;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:34px;padding:16px;box-shadow:var(--shadow);transform:rotate(-2deg);overflow:hidden}.phone:before{content:"PRODUCT PHOTO";display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--green);margin:2px 2px 10px}.phone img{width:100%;display:block;border-radius:24px;object-fit:contain;background:#fff}.ai-card{position:absolute;right:0;top:70px;width:62%;background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:var(--shadow)}.ai-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.status{font-size:12px;font-weight:700;color:var(--green);background:var(--soft);padding:7px 10px;border-radius:999px}.field{padding:13px 0;border-bottom:1px solid #eee7da}.field:last-child{border:0}.field small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.09em;margin-bottom:4px}.field strong{font-size:14px}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat{background:#f1efe8;border-radius:14px;padding:12px}.stat b{display:block;font-size:20px}.float-tag{position:absolute;background:#0d201b;color:white;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:700;box-shadow:var(--shadow)}.tag1{right:18px;bottom:70px}.tag2{left:95px;bottom:5px;background:var(--green)}
    .trust{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(255,253,248,.35)}.trust-in{padding:20px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center;font-size:14px;font-weight:700}.trust-in span{color:var(--green)}
    .problem-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:40px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:28px}.panel.bad{background:#f0e8dd}.steps-mini{display:grid;gap:10px;margin-top:18px}.steps-mini div{display:flex;gap:12px;align-items:center}.num{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:12px;font-weight:700;flex:0 0 auto}.good .num{background:var(--green)}
    .how{background:var(--ink);color:white}.how .eyebrow{color:#93d6be}.how .lead{color:#cfd8d3}.step-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:42px}.step{border:1px solid rgba(255,255,255,.16);padding:24px;border-radius:22px;background:rgba(255,255,255,.04)}.step .n{font-family:"Playfair Display";font-size:42px;color:#8fd2b9}.step p{color:#cfd8d3;font-size:14px}.how .btn{margin-top:32px}
    .features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}.feature{padding:24px;border:1px solid var(--line);border-radius:20px;background:rgba(255,253,248,.65)}.ico{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;margin-bottom:16px;font-weight:800;color:var(--green)}.feature p{font-size:14px;color:#59655e;margin-bottom:0}
    .continuous{display:grid;grid-template-columns:.9fr 1.1fr;gap:36px;align-items:center}.queue-card{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:14px;box-shadow:var(--shadow)}.queue-card img{width:100%;display:block;border-radius:18px}.flow{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.flow span{padding:9px 12px;border-radius:10px;background:var(--soft);font-size:13px;font-weight:700}.flow i{font-style:normal;color:var(--green);align-self:center}
    .usecases{background:#efe8dc}.case-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}.case{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px}.case strong{display:block;font-size:19px;margin-bottom:8px}.case p{font-size:14px;color:#59655e}
    .showcase-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:42px}.shot{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:14px;overflow:hidden}.shot img{width:100%;display:block;border-radius:16px;max-height:460px;object-fit:cover;object-position:top}.shot h3{font-size:18px;margin:16px 8px 4px}.shot p{font-size:13px;color:var(--muted);margin:0 8px 10px}
    .pricing{background:#0f241d;color:white}.pricing .lead{color:#d2ddd8}.price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:42px}.price{position:relative;padding:26px;border:1px solid rgba(255,255,255,.17);border-radius:24px;background:rgba(255,255,255,.055)}.price.pop{background:white;color:var(--ink);transform:translateY(-10px)}.ribbon{position:absolute;right:18px;top:16px;background:var(--green);color:#fff;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.price h3{font-size:18px}.amount{font-family:"Playfair Display";font-size:42px;font-weight:800;margin:12px 0 2px}.amount small{font-family:"DM Sans";font-size:13px;font-weight:600}.price ul{padding:0;margin:20px 0;list-style:none;display:grid;gap:10px;font-size:13px}.price li:before{content:"✓";margin-right:8px;color:#7bc8ac;font-weight:800}.price.pop li:before{color:var(--green)}.price .btn{width:100%}
    .testimonials{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px}.quote{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px}.quote p{font-size:17px}.quote small{color:var(--muted)}.quote em{font-style:normal;color:#a07f52;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
    .faq{display:grid;grid-template-columns:.75fr 1.25fr;gap:44px}.faq-list{display:grid;gap:10px}.faq-item{border:1px solid var(--line);background:var(--paper);border-radius:16px;overflow:hidden}.faq-q{width:100%;text-align:left;border:0;background:transparent;padding:18px 20px;font:inherit;font-weight:700;cursor:pointer;display:flex;justify-content:space-between}.faq-a{display:none;padding:0 20px 18px;color:#5c675f;font-size:14px}.faq-item.open .faq-a{display:block}.faq-item.open .faq-q span{transform:rotate(45deg)}
    .final{padding:94px 0}.finalbox{background:linear-gradient(135deg,var(--green),#0c5c47);color:#fff;border-radius:34px;padding:56px;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}.finalbox p{color:#d8eee6;max-width:650px}.finalbox .btn{background:#fff;color:var(--ink);border-color:#fff}
    footer{border-top:1px solid var(--line);padding:28px 0 38px}.foot{display:flex;justify-content:space-between;gap:30px;align-items:center}.footlinks{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#657068}
    @media(max-width:980px){.links a:not(.btn){display:none}.hero-grid,.continuous,.faq{grid-template-columns:1fr}.hero-visual{min-height:650px}.step-grid,.price-grid{grid-template-columns:repeat(2,1fr)}.features,.case-grid,.showcase-grid,.testimonials{grid-template-columns:repeat(2,1fr)}.trust-in{grid-template-columns:repeat(2,1fr)}.finalbox{grid-template-columns:1fr}.price.pop{transform:none}}
    @media(max-width:650px){.wrap{width:min(100% - 24px,1180px)}.section{padding:72px 0}.hero{padding-top:42px}.links{gap:10px}.links .btn.small{padding:10px 14px}.hero-visual{min-height:560px}.phone{width:62%;top:30px}.ai-card{width:72%;top:120px;padding:18px}.tag1{right:0;bottom:45px}.tag2{left:25px;bottom:0}.problem-grid,.step-grid,.features,.case-grid,.showcase-grid,.price-grid,.testimonials{grid-template-columns:1fr}.trust-in{grid-template-columns:1fr 1fr;font-size:12px}.finalbox{padding:34px 24px}.foot{align-items:flex-start;flex-direction:column}.amount{font-size:36px}}
  </style>
</head>
