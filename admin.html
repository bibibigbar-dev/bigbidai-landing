<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog Admin | bigbid AI</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://bigbidai.com/admin" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap navin">
      <a class="brand" href="/"><img src="/assets/logo.png?v=2" width="180" height="60" alt="BigbidAI"></a>
      <div class="nav-actions">
        <a class="btn primary small nav-cta" href="https://my.bigbidai.com/">Try for Free</a>
        <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="primary-menu">
          <span class="menu-toggle-bars" aria-hidden="true"></span>
        </button>
      </div>
      <nav class="links" id="primary-menu" aria-label="Primary">
        <a href="/#product">Product</a>
        <a href="/#usecases">Use Cases</a>
        <a href="/#pricing">Pricing</a>
        <a href="/#testimonials">Testimonials</a>
        <a href="/#faq">FAQ</a>
        <a href="/contact">Contact</a>
        <a href="/blog">Blog</a>
        <a href="/admin" aria-current="page">Admin</a>
        <a class="btn primary small links-cta" href="https://my.bigbidai.com/">Try for Free</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <div class="eyebrow">Admin</div>
        <h1 id="admin-heading">Admin sign in</h1>
        <p class="lead" id="admin-lead">Sign in with your bigbid AI admin account to write and publish blog posts.</p>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="wrap admin-shell">
        <div id="admin-status" class="form-status" role="status"></div>

        <div id="login-panel" class="admin-panel">
          <h2>Sign in</h2>
          <p class="muted">Use the same account as my.bigbidai.com. Your profile must have <code>is_admin = true</code>.</p>
          <form id="login-form">
            <div class="form-field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required autocomplete="username">
            </div>
            <div class="form-field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" required autocomplete="current-password">
            </div>
            <button class="btn primary" type="submit">Sign in</button>
          </form>
        </div>

        <div id="editor-panel" class="admin-layout" hidden>
          <aside class="admin-panel">
            <div class="admin-aside-head">
              <h2>Posts</h2>
              <button class="btn small" type="button" id="new-post-btn">New</button>
            </div>
            <div id="posts-list" class="admin-posts"></div>
            <button class="btn" type="button" id="sign-out-btn" style="width:100%;margin-top:18px">Sign out</button>
          </aside>

          <div class="admin-panel">
            <form id="post-form">
              <input type="hidden" id="post-id" name="id">
              <div class="form-field">
                <label for="title">Title</label>
                <input id="title" name="title" type="text" required maxlength="180" placeholder="How to price auction lots faster">
              </div>
              <div class="form-field">
                <label for="slug">Slug</label>
                <input id="slug" name="slug" type="text" required maxlength="180" placeholder="how-to-price-auction-lots">
              </div>
              <div class="form-field">
                <label for="excerpt">Excerpt</label>
                <textarea id="excerpt" name="excerpt" maxlength="400" placeholder="Short summary for the blog list and Google snippet."></textarea>
              </div>
              <div class="form-field">
                <label for="cover_image_url">Cover image URL</label>
                <input id="cover_image_url" name="cover_image_url" type="url" maxlength="500" placeholder="https://...">
              </div>
              <div class="form-field">
                <label for="content">Content (Markdown)</label>
                <textarea id="content" name="content" required placeholder="## Heading&#10;&#10;Write your article here."></textarea>
              </div>
              <div class="form-field">
                <label for="status">Status</label>
                <select id="status" name="status">
                  <option value="draft">Draft</option>
                  <option value="published">Published</option>
                </select>
              </div>
              <div class="admin-actions">
                <button class="btn primary" type="submit">Save</button>
                <button class="btn" type="button" id="delete-post-btn">Delete</button>
                <a class="btn" id="view-post-link" href="/blog" target="_blank" rel="noopener">View blog</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/admin.js"></script>
  <script type="module" src="/nav-menu.js"></script>
</body>
</html>
